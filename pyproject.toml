[project]
name = "qcm-viewer"
version = "0.3.0"
description = "Interactive QCM-D and EQCM viewer built with Panel, HoloViews, Polars, and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
  { name = "Albin Carlsson", email = "albin.carlsson@protonmail.com" },
  { name = "Uppsala University" },
]
keywords = ["QCM-D", "EQCM", "quartz crystal microbalance", "electrochemistry", "electrogravimetry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "bokeh>=3.4",
  "datashader>=0.16",
  "duckdb>=1.0",
  "holoviews>=1.19",
  "hvplot>=0.10",
  "matplotlib>=3.8",
  "jupyterlab>=4.0",
  "jupyter-bokeh>=4.0",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "panel>=1.5",
  "polars>=1.0",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "scipy>=1.11",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "import-linter>=2.0"]

[project.scripts]
qcm = "qcm.cli:app"

[tool.setuptools.packages.find]
include = ["qcm*"]

[tool.ruff]
line-length = 110
# Reference and scratch notebooks are exploratory artefacts, not maintained code.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Default rule set (pyflakes F + pycodestyle E/W). The shipped `qcm/` package is
# kept fully clean; tests and tooling scripts get the relaxations below.
[tool.importlinter]
# Enforce the layering the ADRs promise (ADR 0001/0002): the pure science layer
# and the core data/IO layer never depend on the UI. Run with `lint-imports`.
root_package = "qcm"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure science layer is UI-free"
type = "forbidden"
source_modules = ["qcm.viz.science", "qcm.viz.echem"]
forbidden_modules = ["panel", "bokeh", "holoviews", "hvplot", "datashader"]

[[tool.importlinter.contracts]]
name = "Core data/IO layer never pulls rendering libraries"
type = "forbidden"
source_modules = [
    "qcm.run", "qcm.ingest", "qcm.models", "qcm.profiles",
    "qcm.timeutil", "qcm.annotations", "qcm.log",
]
forbidden_modules = ["panel", "bokeh", "holoviews", "hvplot", "datashader"]

[[tool.importlinter.contracts]]
# Storage/model/profile modules never reach the viz package at all. `qcm.run` is
# intentionally excluded: its notebook export (`to_notebook`) reuses the *pure*
# science layer, which today is namespaced under `qcm.viz` (science/theme are
# UI-free; relocating them out of `qcm.viz` is future work).
name = "Storage and model layer is viz-free"
type = "forbidden"
source_modules = [
    "qcm.ingest", "qcm.models", "qcm.profiles", "qcm.timeutil", "qcm.annotations", "qcm.log",
]
forbidden_modules = ["qcm.viz"]

[tool.ruff.lint.per-file-ignores]
# Test bodies and one-off tooling scripts favour compact, multi-statement lines
# (e.g. `a = make(); b = make()` setup) — readable in context, not worth
# splitting. Lint everything else strictly.
"tests/*" = ["E701", "E702"]
"tools/*" = ["E701", "E702"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
